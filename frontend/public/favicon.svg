<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Bold "n" lettermark made from geometric paths -->
  <!-- Left vertical bar -->
  <rect x="7" y="7" width="5" height="18" rx="1.5" fill="white"/>
  <!-- Right vertical bar (short — lowercase n has arch, not full bar) -->
  <rect x="20" y="13" width="5" height="12" rx="1.5" fill="white"/>
  <!-- Arch connecting left to right -->
  <path d="M12 13 Q12 8 16 8 Q20 8 20 13" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
